<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Real-Time Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .chat-container {
            width: 400px;
            margin: 100px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .messages {
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
            border-bottom: 1px solid #ddd;
            padding: 10px;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>Real-Time Chat</h2>
        <div id="username-section">
            <input type="text" id="username-input" class="input-field" placeholder="Enter your name" />
            <input type="email" id="email-input" class="input-field" placeholder="Enter your email" />
            <input type="tel" id="phone-input" class="input-field" placeholder="Enter your phone number" />
            <button onclick="setUsername()">Join Chat</button>
        </div>

        <div id="chat-section" style="display: none;">
            <div id="messages" class="messages"></div>
            <input type="text" id="message-input" class="input-field" placeholder="Type a message..." />
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
    <script>
        var socket = io.connect('http://' + document.domain + ':' + location.port);
        var username = "";

        function setUsername() {
            const name = document.getElementById('username-input').value.trim();
            const email = document.getElementById('email-input').value.trim();
            const phone = document.getElementById('phone-input').value.trim();

            if (name && email && phone) {
                // First, store the info in the backend
                fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, phone })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        username = name;
                        socket.emit('set_username', username);
                        document.getElementById('username-section').style.display = 'none';
                        document.getElementById('chat-section').style.display = 'block';
                    } else {
                        alert("Registration failed.");
                    }
                })
                .catch(error => {
                    console.error("Error registering user:", error);
                    alert("Server error.");
                });
            } else {
                alert("Please fill all fields.");
            }
        }

        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const message = e.target.value;
                socket.send({ 'message': message });
                e.target.value = '';
            }
        });

        socket.on('message', function(data) {
            const messageDiv = document.createElement('div');
            messageDiv.textContent = data.user + ": " + data.message;
            const messagesContainer = document.getElementById('messages');
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    </script>
</body>
</html>
